name: apk
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          unzip -oq project.zip -d g
          python3 - <<'PY'
          p='g/export_presets.cfg'
          s=open(p,encoding='utf-8').read().split('\n')
          s=[l for l in s if 'target_sdk' not in l]
          open(p,'w',encoding='utf-8').write('\n'.join(s))
          q='g/project.godot'
          t=open(q,encoding='utf-8').read()
          lines=[l for l in t.split('\n') if 'import_etc2_astc' not in l]
          out=[]
          for l in lines:
              out.append(l)
              if l.strip()=='[rendering]':
                  out.append('textures/vram_compression/import_etc2_astc=true')
          open(q,'w',encoding='utf-8').write('\n'.join(out))
          print('[自检] target_sdk:', sum('target_sdk' in l for l in s))
          print('[自检] etc2:', [l for l in out if 'etc2' in l])
          PY
          bash g/tools/ci_build.sh
          mkdir -p out
          cp g/build/stocksim-debug.apk out/stocksim-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: stocksim-apk
          path: out/stocksim-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: out/stocksim-debug.apk
          tag_name: v${{ github.run_number }}
          name: 模拟炒股 APK

